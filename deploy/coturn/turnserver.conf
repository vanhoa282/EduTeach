# EduTeach coturn — sửa các dòng ĐÁNH DẤU trước khi chạy.
# Sau khi sửa xong, điền TURN_CONFIG trong lib/webrtc/session.js:
#   urls: ['turn:<domain>:3478?transport=udp', 'turns:<domain>:5349?transport=tcp']
#   username / credential: trùng với static-auth-secret flow HOẶC user tĩnh dưới đây.

listening-port=3478
tls-listening-port=5349

# THAY: domain trỏ về VPS này (bản ghi A), vd turn.tenban.com
realm=turn.tenban.com
server-name=turn.tenban.com

# Cert cho TURN/TLS (Let's Encrypt của domain trên; có thể bỏ nếu chỉ dùng 3478)
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem

# Cách xác thực ĐƠN GIẢN cho giai đoạn đầu: 1 user tĩnh.
# Production: chuyển sang use-auth-secret + cấp credential ngắn hạn từ server,
# và XOÁ user tĩnh này.
user=eduteach:THAY_BANG_MAT_KHAU_NGAU_NHIEN_DAI
lt-cred-mech

# Bảo vệ relay
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
ec2-instance=0

# Giới hạn hợp lý cho lớp 1-1
max-bps=0
user-quota=8
total-quota=200

log-file=stdout
simple-log
verbose
